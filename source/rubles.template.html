<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#606060">
<title>Скидка на доставку · сумма в рублях</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="entry-screen.css">
<script src="entry-screen.js" defer></script>
<script src="discount-model.js" defer></script>
<script src="catalog.js" defer></script>
<script src="motion.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="loading" role="status"><p id="loading-copy">Загружаем прототип…</p><button id="retry" hidden>Повторить</button></div>
<div id="stage"><main id="app" hidden inert>
{{ENTRY_SCREEN}}
<div id="screen" hidden>
<div class="scroll" id="scroll"><section class="hero">
<div class="hero-background"></div>
<div class="art-viewport" aria-hidden="true"><div class="art">
<img class="art-shadow-main" src="assets/current/2c656.svg" alt="">
<img class="art-shadow-plant-large" src="assets/current/dc2fe.svg" alt="">
<img class="art-shadow-plant-small" src="assets/current/171be.svg" alt="">
<img class="van" src="assets/current/cb77b.png" alt="">
<img class="plant" src="assets/current/1adf4.png" alt="">
<img class="bag" src="assets/current/c4cf7.png" alt="">
<img class="promo-badge" src="assets/current/promo-badge.png" alt="">
</div></div>
<div class="statusbar" aria-hidden="true"><img class="status-content" src="assets/current/16c6d.svg" alt=""></div>
<button class="back" aria-label="Назад"><img src="assets/current/f178c.svg" alt=""></button>
<div class="hero-copy"><h1>Скидка<br>на доставку</h1><p>Чтобы сделать товары<br>привлекательнее</p></div>
<div class="metrics"><div class="metric"><strong>x2,5</strong><span>Растет скорость<br>продажи</span></div><div class="metric" id="buyers-metric"><strong>x3</strong><span>Растёт количество<br>покупателей</span></div></div>
</section>
<nav class="tabs" aria-label="Товары"><button class="tab active" data-tab="eligible"><span>Подходят</span><small id="eligible-count"></small></button><button class="tab" data-tab="discounted"><span>Со скидкой</span><small id="discounted-count"></small></button></nav>
<section id="catalog" class="catalog" aria-label="Список товаров"></section></div>
<header class="catalog-header" id="catalog-header" hidden><div class="compact-status"><img src="assets/current/35e2b.svg" alt=""></div><div class="compact-title"><button class="back" aria-label="Назад к спецпредложениям"><img src="assets/current/f178c.svg" alt=""></button><strong>Скидка на доставку</strong></div><nav class="category-nav" id="category-nav" aria-label="Категории товаров"></nav></header>
<section class="selection">
<button class="count-pill" id="select-all"><img src="assets/current/a4747.svg" alt=""><span id="selection-count"></span></button>
<div class="calculator">
<div class="calculator-controls">
<div class="options" id="options"></div>
<button class="primary" id="apply">Применить</button>
</div><div class="home"><span></span></div>
</div></section></div>
<section id="editor" class="editor" role="dialog" aria-modal="true" aria-label="Настройка скидки" hidden>
<button id="cancel-area" class="cancel-area" aria-label="Отменить изменение"></button>
<div class="editor-stack">
<div class="editor-product" id="editor-product"></div>
<div class="editor-controls">
<div id="bulk-notice" class="bulk-notice" role="status" hidden></div>
<div class="editor-panel">
<div class="editor-options options" id="editor-options"></div>
<button id="done" class="primary">Применить скидку</button>
<button id="cancel-edit" class="primary secondary">Не применять</button>
<button id="remove-discount" class="primary secondary" hidden>Удалить скидку</button>
</div><div id="keyboard" class="keyboard"></div></div></div>
</section>
<div class="toast" id="toast" hidden><span id="toast-message" role="status"></span><button id="dismiss-toast" aria-label="Закрыть уведомление"><img src="assets/current/3c5f8.svg" alt=""></button></div>
</main></div>
</body>
</html>
